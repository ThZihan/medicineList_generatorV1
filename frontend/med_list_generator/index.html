<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicine List Generator - Senior Friendly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="title">Medicine List Generator</h1>
            <p class="subtitle">Easy-to-read medication schedule for seniors</p>
        </header>

        <main class="main-content">
            <div class="form-container">
                <section class="patient-section">
                    <div class="form-group">
                        <label for="patientName">Patient Name</label>
                        <input type="text" id="patientName" name="patientName" required
                               placeholder="Enter patient's full name" autocomplete="off">
                    </div>
                </section>

                <section class="form-section">
                    <div class="section-header">
                        <h2>Add New Medicine</h2>
                        <span class="medicine-count" id="medicineCount">0 medicines</span>
                    </div>

                    <form id="medicineForm" class="medicine-form">
                        <div class="form-group autocomplete-container">
                            <label for="medicineName">Medicine Name</label>
                            <input type="text" id="medicineName" name="medicineName" required
                                   placeholder="Type medicine name or search from list" autocomplete="off">
                            <div class="autocomplete-dropdown" id="autocompleteDropdown"></div>
                        </div>

                        <div class="form-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                            <div class="form-group">
                                <label for="genericName">Generic Name</label>
                                <input type="text" id="genericName" name="genericName" placeholder="Auto-filled" readonly>
                            </div>
                            <div class="form-group">
                                <label for="dose">Dosage</label>
                                <input type="text" id="dose" name="dose" placeholder="e.g. 50mg">
                            </div>
                        </div>

                        <div class="form-group">
                            <label>When to Take (Select all that apply)</label>
                            <div class="timing-group">
                                <label class="timing-card">
                                    <input type="checkbox" name="timing" value="morning">
                                    <div class="timing-content">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
                                        <span>Morning</span>
                                    </div>
                                </label>
                                <label class="timing-card">
                                    <input type="checkbox" name="timing" value="noon">
                                    <div class="timing-content">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                                        <span>Noon</span>
                                    </div>
                                </label>
                                <label class="timing-card">
                                    <input type="checkbox" name="timing" value="night">
                                    <div class="timing-content">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
                                        <span>Night</span>
                                    </div>
                                </label>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="frequency">How Often (Frequency)</label>
                            <select id="frequency" name="frequency" required>
                                <option value="Daily">Daily (Every day)</option>
                                <option value="per NEED">As Needed (When required)</option>
                                <option value="Weekly">Weekly (Once a week)</option>
                                <option value="Only Friday">Friday Only</option>
                                <option value="Except WED & THUR">No Wednesday & Thursday</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Take With Food</label>
                            <div class="food-group">
                                <label class="food-toggle">
                                    <input type="radio" name="foodTiming" value="BEFORE FOOD" required>
                                    <div class="toggle-content">Before Food</div>
                                </label>
                                <label class="food-toggle">
                                    <input type="radio" name="foodTiming" value="AFTER FOOD">
                                    <div class="toggle-content">After Food</div>
                                </label>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="usedFor">Used For (Purpose)</label>
                            <input type="text" id="usedFor" name="usedFor" placeholder="e.g. Blood pressure, Thyroid">
                        </div>

                        <div class="form-group">
                            <label>Special Instructions (Remarks)</label>
                            <div class="remarks-group">
                                <label class="checkbox-label">
                                    <input type="checkbox" name="remarks" value="Complete full course">
                                    <span>Complete full course</span>
                                </label>
                                <label class="checkbox-label">
                                    <input type="checkbox" name="remarks" value="Not to lie down for 1 hour">
                                    <span>Stay upright for 1 hour after taking</span>
                                </label>
                                <label class="checkbox-label">
                                    <input type="checkbox" name="remarks" value="Take with plenty of water">
                                    <span>Take with plenty of water</span>
                                </label>
                            </div>
                            <input type="text" id="customRemarks" name="customRemarks" 
                                   placeholder="Or type your own instructions here..." style="margin-top: 1rem;">
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">Add Medicine</button>
                            <button type="button" class="btn btn-secondary" id="clearForm">Clear Form</button>
                        </div>
                    </form>
                </section>
            </div>

            <section class="list-section">
                <div class="section-header">
                    <h2>Medicine Schedule</h2>
                    <div class="list-actions">
                        <button class="btn btn-secondary" id="clearAll" style="padding: 0.75rem 1.25rem; font-size: 0.9rem;">Clear All</button>
                    </div>
                </div>

                <div class="medicine-list-wrapper">
                    <div class="medicine-list" id="medicineList">
                        <div class="empty-state">
                            <div class="empty-icon">💊</div>
                            <p>No medicines added yet</p>
                            <p style="font-size: 1rem; color: var(--text-light); margin-top: 0.5rem;">Use the form above to add medicines to your schedule</p>
                        </div>
                    </div>
                    <div class="scroll-indicator" id="scrollIndicator" aria-hidden="true">
                        <div class="scroll-indicator-arrow">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M7 13l5 5 5-5M7 6l5 5 5-5"/>
                            </svg>
                        </div>
                        <span class="scroll-indicator-text">Scroll down for more</span>
                    </div>
                </div>

                <div class="generate-actions">
                    <button class="btn" id="generatePDF">Generate PDF Document</button>
                </div>
            </section>
        </main>

        <footer style="text-align: center; margin-top: 4rem; padding: 2rem; border-top: 2px solid var(--border-color); color: var(--text-light); font-size: 0.95rem;">
            <p>&copy; 2024 Medicine List Generator. Designed for seniors and caregivers.</p>
        </footer>
    </div>

    <script src="medicines.js"></script>
    <script src="script.js"></script>
</body>
</html>
